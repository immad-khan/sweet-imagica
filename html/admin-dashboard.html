<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sweet Imagica</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .admin-header {
            background: linear-gradient(135deg, #9b587c 0%, #d946a6 100%);
            color: white;
            padding: 2rem 0;
            box-shadow: 0 5px 20px rgba(155, 88, 124, 0.3);
        }

        .admin-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .stats-card h3 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #9b587c;
            margin: 0;
        }

        .stats-card p {
            color: #666;
            margin: 0;
            font-weight: 600;
        }

        .order-table {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-processing {
            background: #cfe2ff;
            color: #084298;
        }

        .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .btn-action {
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="admin-title">
                    <i class="bi bi-speedometer2"></i> Admin Dashboard
                </h1>
                <a href="homepage.html" class="btn btn-light">
                    <i class="bi bi-house"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <!-- Stats Row -->
        <div class="row">
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="totalOrders">0</h3>
                    <p>Total Orders</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="pendingOrders">0</h3>
                    <p>Pending</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="processingOrders">0</h3>
                    <p>Processing</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="completedOrders">0</h3>
                    <p>Completed</p>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="order-table">
            <h3 class="mb-4">
                <i class="bi bi-list-ul"></i> All Orders
            </h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Child Name</th>
                            <th>Theme</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="8" class="text-center">Loading orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Update Order Modal -->
    <div class="modal fade" id="updateOrderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateOrderForm">
                        <input type="hidden" id="orderId">
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="orderStatus">
                                <option value="pending">Pending</option>
                                <option value="processing">Processing</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Download Path (for completed orders)</label>
                            <input type="text" class="form-control" id="downloadPath" placeholder="html/flipbooks/book123.html">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Update Order</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const apiUrl = 'http://localhost:3000/api';

        // Load all orders
        async function loadOrders() {
            try {
                const response = await fetch(`${apiUrl}/admin/orders`);
                const data = await response.json();
                
                if (data.success) {
                    displayOrders(data.orders);
                    updateStats(data.orders);
                }
            } catch (error) {
                console.error('Load orders error:', error);
            }
        }

        function displayOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No orders found</td></tr>';
                return;
            }
            
            tbody.innerHTML = orders.map(order => {
                const customData = order.customData || {};
                const statusClass = `status-${order.status}`;
                
                return `
                    <tr>
                        <td>${order._id.slice(-8)}</td>
                        <td>${order.userID?.username || 'N/A'}<br><small>${order.userID?.email || ''}</small></td>
                        <td>${customData.childName || 'N/A'}</td>
                        <td>${customData.theme || 'N/A'}</td>
                        <td><strong>$${order.price?.toFixed(2) || '0.00'}</strong></td>
                        <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                        <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-sm btn-primary btn-action" onclick='viewOrder(${JSON.stringify(order)})'>
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-success btn-action" onclick='updateOrder("${order._id}", "${order.status}", "${order.downloadPath || ''}")'>
                                <i class="bi bi-pencil"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(orders) {
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'pending').length;
            document.getElementById('processingOrders').textContent = orders.filter(o => o.status === 'processing').length;
            document.getElementById('completedOrders').textContent = orders.filter(o => o.status === 'completed').length;
        }

        function viewOrder(order) {
            const customData = order.customData || {};
            alert(`Order Details:\n\nChild: ${customData.childName}\nAge: ${customData.childAge}\nTheme: ${customData.theme}\nLanguage: ${customData.storyLanguage}\nPrice: $${order.price}`);
        }

        function updateOrder(orderId, currentStatus, currentPath) {
            document.getElementById('orderId').value = orderId;
            document.getElementById('orderStatus').value = currentStatus;
            document.getElementById('downloadPath').value = currentPath;
            
            const modal = new bootstrap.Modal(document.getElementById('updateOrderModal'));
            modal.show();
        }

        document.getElementById('updateOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const orderId = document.getElementById('orderId').value;
            const status = document.getElementById('orderStatus').value;
            const downloadPath = document.getElementById('downloadPath').value;
            
            try {
                const response = await fetch(`${apiUrl}/admin/orders/${orderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, downloadPath })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Order updated successfully!');
                    const modal = bootstrap.Modal.getInstance(document.getElementById('updateOrderModal'));
                    modal.hide();
                    loadOrders();
                }
            } catch (error) {
                alert('❌ Failed to update order');
            }
        });
        // Check if user is admin
if (!auth.requireAdmin()) {
    // Will redirect if not admin
}

// Display admin info
const user = auth.getCurrentUser();
if (user) {
    document.querySelector('.admin-title').innerHTML = `
        <i class="bi bi-speedometer2"></i> Admin Dashboard 
        <small style="font-size: 0.6em; opacity: 0.9;">| ${user.username}</small>
    `;
}

// Logout button
document.querySelector('a[href="homepage.html"]').parentElement.innerHTML = `
    <a href="homepage.html" class="btn btn-light me-2">
        <i class="bi bi-house"></i> Home
    </a>
    <button onclick="auth.logout()" class="btn btn-danger">
        <i class="bi bi-box-arrow-right"></i> Logout
    </button>
`;

        // Load orders on page load
        loadOrders();
        
        // Refresh every 30 seconds
        setInterval(loadOrders, 30000);
    </script>
</body>
</html>
