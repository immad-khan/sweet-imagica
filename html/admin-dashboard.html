<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sweet Imagica</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .admin-header {
            background: linear-gradient(135deg, #9b587c 0%, #d946a6 100%);
            color: white;
            padding: 2rem 0;
            box-shadow: 0 5px 20px rgba(155, 88, 124, 0.3);
        }

        .admin-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .stats-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .stats-card h3 {
            font-size: 2.5rem;
            font-weight: 800;
            color: #9b587c;
            margin: 0;
        }

        .stats-card p {
            color: #666;
            margin: 0;
            font-weight: 600;
        }

        .order-table {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .status-badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-processing {
            background: #cfe2ff;
            color: #084298;
        }

        .status-completed {
            background: #d1e7dd;
            color: #0f5132;
        }

        .btn-action {
            padding: 0.4rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
        }

        /* Order Details Modal */
        .detail-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
        }

        .detail-section h6 {
            color: #9b587c;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0.2rem 0;
            font-size: 0.9rem;
        }

        .detail-row .label {
            color: #666;
            min-width: 140px;
            flex-shrink: 0;
        }

        .detail-row .value {
            font-weight: 600;
            color: #333;
            text-align: right;
            word-break: break-word;
        }

        .detail-row .value.yes { color: #0f5132; }
        .detail-row .value.no  { color: #aaa; }

        #viewOrderModal .modal-header {
            background: linear-gradient(135deg, #9b587c 0%, #d946a6 100%);
            color: white;
        }

        #viewOrderModal .modal-header .btn-close {
            filter: invert(1);
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="admin-title">
                    <i class="bi bi-speedometer2"></i> Admin Dashboard
                </h1>
                <a href="homepage.html" class="btn btn-light">
                    <i class="bi bi-house"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <!-- Stats Row -->
        <div class="row">
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="totalOrders">0</h3>
                    <p>Total Orders</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="pendingOrders">0</h3>
                    <p>Pending</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="processingOrders">0</h3>
                    <p>Processing</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card text-center">
                    <h3 id="completedOrders">0</h3>
                    <p>Completed</p>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="order-table">
            <h3 class="mb-4">
                <i class="bi bi-list-ul"></i> All Orders
            </h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Child Name</th>
                            <th>Theme</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="8" class="text-center">Loading orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ===== View Order Details Modal ===== -->
    <div class="modal fade" id="viewOrderModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-file-earmark-text me-2"></i>Order Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="viewOrderBody">
                    <!-- Populated by viewOrder() -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Update Order Modal ===== -->
    <div class="modal fade" id="updateOrderModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Update Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateOrderForm">
                        <input type="hidden" id="orderId">
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="orderStatus">
                                <option value="pending">Pending</option>
                                <option value="processing">Processing</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Download Path (for completed orders)</label>
                            <input type="text" class="form-control" id="downloadPath" placeholder="html/flipbooks/book123.html">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Update Order</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
    
    <script>
        const apiUrl = 'http://localhost:3000/api';

        // Global cache — buttons reference orders by index, never by inline JSON
        let ordersCache = [];

        // ── Load all orders ──────────────────────────────────────────────────
        async function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            try {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Loading orders...</td></tr>';
                const response = await fetch(`${apiUrl}/admin/orders`);
                const data = await response.json();
                
                if (data.success) {
                    ordersCache = data.orders;
                    displayOrders(data.orders);
                    updateStats(data.orders);
                } else {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">❌ Server error: ${data.message}</td></tr>`;
                }
            } catch (error) {
                console.error('Load orders error:', error);
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">❌ Failed to connect to server.<br><small>${error.message}</small></td></tr>`;
            }
        }

        // ── Render table rows ────────────────────────────────────────────────
        function displayOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No orders found</td></tr>';
                return;
            }
            
            tbody.innerHTML = orders.map((order, index) => {
                const customData = order.customData || {};
                const statusClass = `status-${order.status}`;
                
                return `
                    <tr>
                        <td>${order._id.slice(-8)}</td>
                        <td>${order.userID?.username || 'N/A'}<br><small>${order.userID?.email || ''}</small></td>
                        <td>${customData.childName || 'N/A'}</td>
                        <td>${customData.theme || 'N/A'}</td>
                        <td><strong>$${order.price?.toFixed(2) || '0.00'}</strong></td>
                        <td><span class="status-badge ${statusClass}">${order.status}</span></td>
                        <td>${new Date(order.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-sm btn-primary btn-action me-1" onclick="viewOrder(${index})" title="View Details">
                                <i class="bi bi-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-success btn-action" onclick="updateOrder('${order._id}', '${order.status}', '${order.downloadPath || ''}')" title="Update Status">
                                <i class="bi bi-pencil"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ── Stats ────────────────────────────────────────────────────────────
        function updateStats(orders) {
            document.getElementById('totalOrders').textContent = orders.length;
            document.getElementById('pendingOrders').textContent = orders.filter(o => o.status === 'pending').length;
            document.getElementById('processingOrders').textContent = orders.filter(o => o.status === 'processing').length;
            document.getElementById('completedOrders').textContent = orders.filter(o => o.status === 'completed').length;
        }

        // ── View full order details ──────────────────────────────────────────
        function viewOrder(index) {
            const order = ordersCache[index];
            if (!order) return;

            const c = order.customData || {};
            const yn = v => v === 'yes'
                ? '<span class="value yes">✅ Yes</span>'
                : '<span class="value no">❌ No</span>';
            const val = v => `<span class="value">${v || '—'}</span>`;

            document.getElementById('viewOrderBody').innerHTML = `
                <!-- Order Meta -->
                <div class="detail-section">
                    <h6>📦 Order Info</h6>
                    <div class="detail-row"><span class="label">Order ID</span>${val(order._id)}</div>
                    <div class="detail-row"><span class="label">Date</span>${val(new Date(order.createdAt).toLocaleString())}</div>
                    <div class="detail-row"><span class="label">Status</span><span class="value"><span class="status-badge status-${order.status}">${order.status}</span></span></div>
                    <div class="detail-row"><span class="label">Total Price</span><span class="value" style="color:#9b587c;font-size:1.1em;">$${order.price?.toFixed(2) || '0.00'}</span></div>
                </div>

                <!-- Customer -->
                <div class="detail-section">
                    <h6>👤 Customer</h6>
                    <div class="detail-row"><span class="label">Username</span>${val(order.userID?.username)}</div>
                    <div class="detail-row"><span class="label">Email</span>${val(order.userID?.email)}</div>
                </div>

                <!-- Child Info -->
                <div class="detail-section">
                    <h6>🧒 Child Information</h6>
                    <div class="detail-row"><span class="label">Child Name</span>${val(c.childName)}</div>
                    <div class="detail-row"><span class="label">Child Age</span>${val(c.childAge)}</div>
                    <div class="detail-row"><span class="label">Theme</span>${val(c.theme)}</div>
                    <div class="detail-row"><span class="label">Story Style</span>${val(c.storyStyle)}</div>
                    <div class="detail-row"><span class="label">Language</span>${val(c.storyLanguage)}</div>
                </div>

                <!-- Character Appearance -->
                <div class="detail-section">
                    <h6>🎨 Character Appearance</h6>
                    <div class="detail-row"><span class="label">Image to Cartoon</span>${yn(c.imageToCartoon)}</div>
                    <div class="detail-row"><span class="label">Hair Color</span>${val(c.hairColor)}</div>
                    <div class="detail-row"><span class="label">Hair Type</span>${val(c.hairType)}</div>
                    <div class="detail-row"><span class="label">Eye Color</span>${val(c.eyesColor)}</div>
                    <div class="detail-row"><span class="label">Skin Tone</span>${val(c.skinTone)}</div>
                </div>

                <!-- Add-ons -->
                <div class="detail-section">
                    <h6>✨ Add-ons</h6>
                    <div class="detail-row"><span class="label">Voice Over</span>${val(c.voiceOver)}</div>
                    <div class="detail-row"><span class="label">Background Music</span>${yn(c.backgroundMusic)}</div>
                    <div class="detail-row"><span class="label">Sound Effect</span>${yn(c.soundEffect)}</div>
                    <div class="detail-row"><span class="label">Proposed Story</span>${yn(c.proposedStory)}</div>
                    ${c.proposedStory === 'yes' && c.proposedStoryText ? `<div class="detail-row"><span class="label">Story Text</span><span class="value" style="max-width:300px;white-space:pre-wrap;">${c.proposedStoryText}</span></div>` : ''}
                    <div class="detail-row"><span class="label">End Cover</span>${yn(c.endCover)}</div>
                    ${c.endCover === 'yes' ? `
                        <div class="detail-row"><span class="label">Cover Name</span>${val(c.endCoverName)}</div>
                        <div class="detail-row"><span class="label">Relationship</span>${val(c.relationship)}</div>
                        <div class="detail-row"><span class="label">Cover Message</span>${val(c.endCoverMessage)}</div>
                    ` : ''}
                    <div class="detail-row"><span class="label">Custom Cover Image</span>${yn(c.coverImage)}</div>
                </div>

                <!-- Special Instructions -->
                ${c.specialInstructions ? `
                <div class="detail-section">
                    <h6>📝 Special Instructions</h6>
                    <p class="mb-0" style="white-space:pre-wrap;font-size:0.9rem;">${c.specialInstructions}</p>
                </div>` : ''}

                <!-- Price Breakdown -->
                ${c.extraCharges ? `
                <div class="detail-section">
                    <h6>💰 Price Breakdown</h6>
                    <div class="detail-row"><span class="label">Base Price</span><span class="value">$34.99</span></div>
                    ${c.extraCharges.myVoice > 0 ? `<div class="detail-row"><span class="label">My Voice</span><span class="value">+$${c.extraCharges.myVoice}</span></div>` : ''}
                    ${c.extraCharges.proposedStory > 0 ? `<div class="detail-row"><span class="label">Proposed Story</span><span class="value">+$${c.extraCharges.proposedStory}</span></div>` : ''}
                    ${c.extraCharges.endCover > 0 ? `<div class="detail-row"><span class="label">End Cover</span><span class="value">+$${c.extraCharges.endCover}</span></div>` : ''}
                    ${c.extraCharges.coverImage > 0 ? `<div class="detail-row"><span class="label">Cover Image</span><span class="value">+$${c.extraCharges.coverImage}</span></div>` : ''}
                    ${c.extraCharges.backgroundMusic > 0 ? `<div class="detail-row"><span class="label">Background Music</span><span class="value">+$${c.extraCharges.backgroundMusic}</span></div>` : ''}
                    ${c.extraCharges.soundEffect > 0 ? `<div class="detail-row"><span class="label">Sound Effect</span><span class="value">+$${c.extraCharges.soundEffect}</span></div>` : ''}
                    <div class="detail-row mt-1 pt-1 border-top"><span class="label fw-bold">Total</span><span class="value fw-bold" style="color:#9b587c;">$${order.price?.toFixed(2)}</span></div>
                </div>` : ''}
            `;

            new bootstrap.Modal(document.getElementById('viewOrderModal')).show();
        }

        // ── Update order status ──────────────────────────────────────────────
        function updateOrder(orderId, currentStatus, currentPath) {
            document.getElementById('orderId').value = orderId;
            document.getElementById('orderStatus').value = currentStatus;
            document.getElementById('downloadPath').value = currentPath;
            
            new bootstrap.Modal(document.getElementById('updateOrderModal')).show();
        }

        document.getElementById('updateOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const orderId = document.getElementById('orderId').value;
            const status = document.getElementById('orderStatus').value;
            const downloadPath = document.getElementById('downloadPath').value;
            
            try {
                const response = await fetch(`${apiUrl}/admin/orders/${orderId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, downloadPath })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Order updated successfully!');
                    bootstrap.Modal.getInstance(document.getElementById('updateOrderModal')).hide();
                    loadOrders();
                }
            } catch (error) {
                alert('❌ Failed to update order');
            }
        });

        // ── Auth guard ───────────────────────────────────────────────────────
        if (!auth.requireAdmin()) {
            // requireAdmin() redirects automatically
        }

        // Display admin username in header
        const user = auth.getCurrentUser();
        if (user) {
            document.querySelector('.admin-title').innerHTML = `
                <i class="bi bi-speedometer2"></i> Admin Dashboard 
                <small style="font-size: 0.6em; opacity: 0.9;">| ${user.username}</small>
            `;
        }

        // Replace Back to Home button with Home + Logout
        document.querySelector('a[href="homepage.html"]').parentElement.innerHTML = `
            <a href="homepage.html" class="btn btn-light me-2">
                <i class="bi bi-house"></i> Home
            </a>
            <button onclick="auth.logout()" class="btn btn-danger">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        `;

        // Load orders on page load & refresh every 30s
        loadOrders();
        setInterval(loadOrders, 30000);
    </script>
</body>
</html>
