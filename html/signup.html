<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - Sweet Imagica</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #9b587c 0%, #d946a6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            padding: 2rem;
        }

        .auth-header img {
            max-width: 150px;
            margin-bottom: 1rem;
        }

        .auth-header h2 {
            color: #9b587c;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            margin: 0;
        }

        .auth-body {
            padding: 2rem 3rem 3rem 3rem;
        }

        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #9b587c;
            box-shadow: 0 0 0 0.2rem rgba(155, 88, 124, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, #9b587c 0%, #d946a6 100%);
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(155, 88, 124, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            transform: none;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 1.5rem;
        }

        .auth-toggle a {
            color: #9b587c;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .auth-toggle a:hover {
            color: #d946a6;
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
            color: #999;
        }

        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }

        .strength-weak { background: #ff4444; width: 33%; }
        .strength-medium { background: #ffa500; width: 66%; }
        .strength-strong { background: #4caf50; width: 100%; }

        .alert-custom {
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            .auth-body {
                padding: 1.5rem;
            }

            .auth-header img {
                max-width: 100px;
            }

            .auth-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="auth-card">
                    <!-- Header -->
                    <div class="auth-header">
                        <img src="logo.webp" alt="Sweet Imagica">
                        <h2>Welcome Back!</h2>
                    </div>

                    <div class="auth-body">
                        <!-- Alert Message -->
                        <div id="alertMessage" style="display: none;"></div>

                        <!-- Login Form -->
                        <div id="loginForm">
                            <h4 class="mb-4">Login to Your Account</h4>
                            <form id="loginFormElement">
                                <div class="mb-3">
                                    <label for="loginUsername" class="form-label">
                                        <i class="bi bi-person-fill"></i> Username or Email
                                    </label>
                                    <input 
                                        type="text" 
                                        class="form-control" 
                                        id="loginUsername" 
                                        placeholder="Enter your username or email"
                                        required
                                    >
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">
                                        <i class="bi bi-lock-fill"></i> Password
                                    </label>
                                    <div class="input-group">
                                        <input 
                                            type="password" 
                                            class="form-control" 
                                            id="loginPassword"
                                            placeholder="Enter your password" 
                                            required
                                        >
                                        <button 
                                            class="btn btn-outline-secondary" 
                                            type="button" 
                                            onclick="togglePassword('loginPassword')"
                                        >
                                            <i class="bi bi-eye" id="loginPasswordIcon"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">
                                        Remember me
                                    </label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                                    <i class="bi bi-box-arrow-in-right"></i> Login
                                </button>
                            </form>
                            
                            <div class="auth-toggle">
                                <p class="mb-0">
                                    Don't have an account? 
                                    <a href="#" onclick="showRegisterForm(); return false;">Register here</a>
                                </p>
                            </div>
                        </div>

                        <!-- Register Form (Hidden by default) -->
                        <div id="registerForm" style="display: none;">
                            <h4 class="mb-4">Create New Account</h4>
                            <form id="registerFormElement">
                                <div class="mb-3">
                                    <label for="registerUsername" class="form-label">
                                        <i class="bi bi-person-fill"></i> Username
                                    </label>
                                    <input 
                                        type="text" 
                                        class="form-control" 
                                        id="registerUsername"
                                        placeholder="Choose a username" 
                                        required
                                        minlength="3"
                                    >
                                </div>
                                <div class="mb-3">
                                    <label for="registerEmail" class="form-label">
                                        <i class="bi bi-envelope-fill"></i> Email
                                    </label>
                                    <input 
                                        type="email" 
                                        class="form-control" 
                                        id="registerEmail"
                                        placeholder="Enter your email" 
                                        required
                                    >
                                </div>
                                <div class="mb-3">
                                    <label for="registerPassword" class="form-label">
                                        <i class="bi bi-lock-fill"></i> Password
                                    </label>
                                    <div class="input-group">
                                        <input 
                                            type="password" 
                                            class="form-control" 
                                            id="registerPassword"
                                            placeholder="Create a password" 
                                            required 
                                            minlength="6"
                                            oninput="checkPasswordStrength()"
                                        >
                                        <button 
                                            class="btn btn-outline-secondary" 
                                            type="button" 
                                            onclick="togglePassword('registerPassword')"
                                        >
                                            <i class="bi bi-eye" id="registerPasswordIcon"></i>
                                        </button>
                                    </div>
                                    <div class="password-strength">
                                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                                    </div>
                                    <small class="text-muted" id="passwordStrengthText"></small>
                                </div>
                                <div class="mb-3">
                                    <label for="registerConfirmPassword" class="form-label">
                                        <i class="bi bi-lock-fill"></i> Confirm Password
                                    </label>
                                    <div class="input-group">
                                        <input 
                                            type="password" 
                                            class="form-control" 
                                            id="registerConfirmPassword"
                                            placeholder="Confirm your password" 
                                            required
                                        >
                                        <button 
                                            class="btn btn-outline-secondary" 
                                            type="button" 
                                            onclick="togglePassword('registerConfirmPassword')"
                                        >
                                            <i class="bi bi-eye" id="registerConfirmPasswordIcon"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                    <label class="form-check-label" for="agreeTerms">
                                        I agree to the <a href="#" style="color: #9b587c;">Terms & Conditions</a>
                                    </label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                                    <i class="bi bi-person-plus"></i> Register
                                </button>
                            </form>
                            
                            <div class="auth-toggle">
                                <p class="mb-0">
                                    Already have an account? 
                                    <a href="#" onclick="showLoginForm(); return false;">Login here</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Back to Home -->
                <div class="text-center mt-4">
                    <a href="homepage.html" class="text-white text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Auth JS -->
    <script src="auth.js"></script>
    
    <script>
        // Show/Hide Forms
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            clearAlert();
        }

        function showLoginForm() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            clearAlert();
        }

        // Toggle Password Visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById(fieldId + 'Icon');
            
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }

        // Check Password Strength
        function checkPasswordStrength() {
            const password = document.getElementById('registerPassword').value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            const strengthText = document.getElementById('passwordStrengthText');
            
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;
            
            strengthBar.className = 'password-strength-bar';
            
            if (strength <= 2) {
                strengthBar.classList.add('strength-weak');
                strengthText.textContent = 'Weak password';
                strengthText.style.color = '#ff4444';
            } else if (strength <= 3) {
                strengthBar.classList.add('strength-medium');
                strengthText.textContent = 'Medium password';
                strengthText.style.color = '#ffa500';
            } else {
                strengthBar.classList.add('strength-strong');
                strengthText.textContent = 'Strong password';
                strengthText.style.color = '#4caf50';
            }
        }

        // Show Alert
        function showAlert(message, type = 'danger') {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = `
                <div class="alert alert-${type} alert-custom alert-dismissible fade show" role="alert">
                    <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}-fill"></i>
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            alertDiv.style.display = 'block';
        }

        function clearAlert() {
            document.getElementById('alertMessage').style.display = 'none';
        }

        // Handle Login
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
            
            const result = await auth.login(username, password);
            
            if (result.success) {
                if (result.user.isAdmin) {
                    showAlert('✅ Admin login successful! Redirecting to admin dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1500);
                } else {
                    showAlert('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'homepage.html';
                    }, 1500);
                }
            } else {
                showAlert('❌ ' + result.message, 'danger');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Login';
            }
        });

        // Handle Register
        document.getElementById('registerFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const registerBtn = document.getElementById('registerBtn');
            
            if (password !== confirmPassword) {
                showAlert('❌ Passwords do not match!', 'danger');
                return;
            }
            
            if (password.length < 6) {
                showAlert('❌ Password must be at least 6 characters!', 'danger');
                return;
            }
            
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registering...';
            
            const result = await auth.register(username, email, password);
            
            if (result.success) {
                showAlert('✅ Registration successful! Welcome!', 'success');
                setTimeout(() => {
                    window.location.href = 'homepage.html';
                }, 1500);
            } else {
                showAlert('❌ ' + result.message, 'danger');
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Register';
            }
        });

        // Check if already logged in
        if (auth.isLoggedIn()) {
            const user = auth.getCurrentUser();
            showAlert(`You are already logged in as ${user.username}. Redirecting to homepage...`, 'info');
            setTimeout(() => {
                window.location.href = 'homepage.html';
            }, 2000);
        }

    </script>
</body>
</html>
